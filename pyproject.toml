[build-system]
requires = ["scikit-build-core", "swig"]
build-backend = "scikit_build_core.build"

[project]
name = "pokerstove"
version = "1.2"

[tool.scikit-build]
build-dir = "_build/{wheel_tag}"
wheel.packages = []
cmake.version = ">=3.24"
build.targets = ["pokerstove_python"]
install.components = ["python"]
sdist.exclude = ["docs", ".*"]
[tool.scikit-build.cmake.define]
MODERN_POKERSTOVE_BUILD_PYTHON = "ON"
BUILD_TESTING = "OFF"
MODERN_POKERSTOVE_BUILD_APPS = "OFF"
BUILD_SHARED_LIBS = "OFF"

